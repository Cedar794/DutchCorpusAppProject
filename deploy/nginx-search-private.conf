# Pre-filing deployment: authenticated SSH access only; no public website listener.
# Forward locally with: ssh -L 8801:127.0.0.1:8081 dutch-corpus-server
server {
    listen 127.0.0.1:8081;
    server_name localhost nederlands.com.cn www.nederlands.com.cn;
    root /srv/dutch-corpus/frontend/site;
    index index.html;
    client_max_body_size 8k;
    access_log off;
    location = /health { return 404; }
    location ~ ^/((lookup|suggest|semantic-search)|entries/[0-9]+|senses/[0-9]+/examples)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
