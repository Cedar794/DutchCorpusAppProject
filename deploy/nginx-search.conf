# Install in /etc/nginx/conf.d/dutch-search.conf (http context).
# Direct-origin deployment: do not add real_ip_header for arbitrary clients.
limit_req_zone $binary_remote_addr zone=search_edge:10m rate=2r/s;
limit_req_status 429;
server {
    listen 80;
    server_name _;
    client_max_body_size 8k;
    client_body_timeout 10s;
    # Do not log query strings or client IPs by default.
    access_log off;
    location = /health { return 404; }
    location ~ ^/((lookup|suggest|semantic-search)|entries/[0-9]+|senses/[0-9]+/examples)$ {
        limit_req zone=search_edge burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        # Replace, do not append, the caller-supplied forwarded header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 10s;
    }
    location / { return 404; }
}
